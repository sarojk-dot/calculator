<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#111;font-family:sans-serif}
.calc{width:min(92vw,360px);background:#1c1c1e;border-radius:20px;padding:16px}
#screen{background:#000;color:#fff;border-radius:12px;padding:16px;margin-bottom:12px;text-align:right;min-height:90px}
#expr{color:#888;font-size:18px;min-height:24px;word-wrap:break-word}
#out{font-size:40px;word-wrap:break-word}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{padding:18px 0;font-size:22px;border:0;border-radius:14px;background:#333;color:#fff}
button:active{opacity:.6}
.op{background:#ff9f0a}
.fn{background:#a5a5a5;color:#000}
.eq{background:#30d158;grid-column:span 2}
</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111111"></head><body>
<div class="calc">
<div id="screen"><div id="expr"></div><div id="out">0</div></div>
<div class="keys" id="keys"></div>
</div>
<script>
const layout=[["C","fn"],["⌫","fn"],["%","fn"],["÷","op"],
["7"],["8"],["9"],["×","op"],
["4"],["5"],["6"],["−","op"],
["1"],["2"],["3"],["+","op"],
["0"],["."],["=","eq"]];
let expr="";
const out=document.getElementById("out"),ex=document.getElementById("expr");
const ops="+−×÷";
function show(){out.textContent=expr||"0";}
function calc(){
  try{
    let s=expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/%/g,"/100");
    if(!/^[0-9+\-*\/.() ]+$/.test(s))return;
    let r=Function("return "+s)();
    if(!isFinite(r))throw 0;
    ex.textContent=expr+" =";
    expr=String(+r.toFixed(10));
  }catch(e){expr="";ex.textContent="Error";}
  show();
}
function press(k){
  if(k==="C"){expr="";ex.textContent="";}
  else if(k==="⌫"){expr=expr.slice(0,-1);}
  else if(k==="="){return calc();}
  else if(ops.includes(k)){
    if(!expr)return;
    if(ops.includes(expr.slice(-1)))expr=expr.slice(0,-1);
    expr+=k;
  } else expr+=k;
  show();
}
const box=document.getElementById("keys");
layout.forEach(([k,c])=>{
  const b=document.createElement("button");
  b.textContent=k;if(c)b.className=c;
  b.onclick=()=>press(k);
  box.appendChild(b);
});
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script></body></html>
